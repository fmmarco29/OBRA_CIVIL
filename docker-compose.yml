version: '3.8'

services:
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - civil_twin_data:/app/src/data
    environment:
      - DATABASE_URL=sqlite:////app/src/data/civil_twin.db

  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    command: streamlit run app_streamlit.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

volumes:
  civil_twin_data:
