version: "3.8"

services:
  api:
    build: .
    container_name: civil_twin_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  frontend:
    build: .
    container_name: civil_twin_frontend
    command: streamlit run app_streamlit.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    restart: always
    volumes:
      - .:/app
    depends_on:
      - api
    links:
      - api:backend
      - api:api
    environment:
      - STREAMLIT_THEME_BASE=dark
