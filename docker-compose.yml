version: "3.8"

services:
  api:
    build: .
    container_name: civil_twin_api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: always
    volumes:
      - .:/app
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1

  frontend:
    build: ./frontend
    container_name: civil_twin_nextjs
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - api
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
