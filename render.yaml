services:
  # Backend API (FastAPI)
  - type: web
    name: civil-twin-api
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: "./start-api.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:////app/src/data/civil_twin.db
      
  # Frontend UI (Streamlit)
  - type: web
    name: civil-twin-ui
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    dockerCommand: "./start-ui.sh"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: BACKEND_URL
        fromService:
          type: web
          name: civil-twin-api
          envVarKey: RENDER_EXTERNAL_URL
