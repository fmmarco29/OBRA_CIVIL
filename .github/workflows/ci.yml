name: CIVIL-TWIN CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # detiene la construccion si hay errores de sintaxis
        flake8 src app_streamlit.py --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Basic Startup Test (Backend)
      run: |
        # Test that the FastAPI app can be imported without errors
        python -c "from src.api.main import app"
        
    - name: Render Deploy Trigger
      if: github.ref == 'refs/heads/main'
      env:
        deploy_url: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      run: |
        if [ ! -z "$deploy_url" ]; then
          curl "$deploy_url"
        else
          echo "Render deploy hook not set. Skipping auto-deploy."
        fi
